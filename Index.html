<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Reveal - Party Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body { 
            background: #fdfcf0; 
            text-align: center; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; padding: 0;
            overflow: hidden;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }
        
        /* Contenedor de decoraciones de fondo */
        #bg-decoration {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .deco-item {
            position: absolute;
            font-size: 35px;
            opacity: 0.5;
            animation: floatDeco 5s infinite ease-in-out;
        }

        @keyframes floatDeco {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(15deg); }
        }

        h1 { 
            color: #444; z-index: 10; margin-top: 50px; 
            background: rgba(253, 252, 240, 0.8);
            padding: 10px; border-radius: 15px;
        }
        
        .container {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 25px; max-width: 350px; margin-top: 30px; z-index: 10;
            position: relative;
        }
        
        /* Globos */
        .balloon-wrapper { animation: float 3s infinite ease-in-out; z-index: 10; }
        .balloon { 
            position: relative; width: 85px; height: 110px; 
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            cursor: pointer; box-shadow: 2px 5px 12px rgba(0,0,0,0.15);
        }
        .balloon::after {
            content: ""; position: absolute; bottom: -10px; left: 50%;
            transform: translateX(-50%); border-left: 7px solid transparent;
            border-right: 7px solid transparent;
        }
        .balloon-pink { background: radial-gradient(circle at 30% 30%, #ffebee, #ff4081, #c50054); }
        .balloon-pink::after { border-bottom: 12px solid #c50054; }
        .balloon-blue { background: radial-gradient(circle at 30% 30%, #e3f2fd, #40c4ff, #0094cc); }
        .balloon-blue::after { border-bottom: 12px solid #0094cc; }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        #result-screen { display: none; z-index: 20; margin-top: 60px; position: relative; }
        #msg { font-size: 3.5rem; font-weight: 900; margin-bottom: 20px; }
        .boy { color: #2980b9; } .girl { color: #d81b60; }
        button { padding: 15px 30px; border-radius: 30px; cursor: pointer; border: none; background: #444; color: white; font-weight: bold; font-size: 1rem; }
    </style>
</head>
<body>

    <div id="bg-decoration"></div>

    <h1 id="title">🎈 ¿Niño o Niña? 🎈</h1>
    
    <div class="container" id="board"></div>

    <div id="result-screen">
        <div id="msg"></div>
        <button onclick="location.reload()">¿Jugar otra vez? 🔄</button>
    </div>

    <script>
        const ES_NINA = true; // <--- CAMBIAR AQUÍ (true = Niña, false = Niño)
        
        const decoContainer = document.getElementById('bg-decoration');
        const items = ['🚗', '🎀', '🚗', '🎀', '🚗', '🎀', '🚗', '🎀'];

        // Crear decoraciones por toda la pantalla
        for (let i = 0; i < 15; i++) {
            const span = document.createElement('span');
            span.className = 'deco-item';
            span.innerText = items[Math.floor(Math.random() * items.length)];
            span.style.left = Math.random() * 90 + '%';
            span.style.top = Math.random() * 90 + '%';
            span.style.animationDelay = Math.random() * 5 + 's';
            decoContainer.appendChild(span);
        }

        const board = document.getElementById('board');
        const totalBalloons = 6;
        const ganador = Math.floor(Math.random() * totalBalloons);

        for (let i = 0; i < totalBalloons; i++) {
            const wrapper = document.createElement('div');
            wrapper.className = 'balloon-wrapper';
            const balloon = document.createElement('div');
            balloon.className = i % 2 === 0 ? 'balloon balloon-pink' : 'balloon balloon-blue';
            
            balloon.onclick = function() {
                if (i === ganador) { revelar(); } 
                else {
                    wrapper.style.transform = "scale(0)";
                    wrapper.style.opacity = "0";
                    setTimeout(() => wrapper.style.display = "none", 200);
                }
            };
            wrapper.appendChild(balloon);
            board.appendChild(wrapper);
        }

        function revelar() {
            const color = ES_NINA ? '#ff4081' : '#40c4ff';
            confetti({ particleCount: 250, spread: 100, origin: { y: 0.5 }, colors: [color, '#ffffff', '#FFD700'] });
            
            document.body.style.backgroundColor = ES_NINA ? '#ffebee' : '#e3f2fd';
            board.style.display = 'none';
            document.getElementById('bg-decoration').style.display = 'none';
            document.getElementById('title').style.display = 'none';
            
            document.getElementById('msg').innerText = ES_NINA ? '¡ES NIÑA! 🎀' : '¡ES NIÑO! ⚽';
            document.getElementById('msg').className = ES_NINA ? 'girl' : 'boy';
            document.getElementById('result-screen').style.display = 'block';
        }
    </script>
</body>
</html>
